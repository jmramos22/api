name: taller-laravel-api

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MONGO_HOST: mongodb
  MONGO_PORT: 27017
  MONGO_DATABASE: ${MONGO_DATABASE:-laravel}
  MONGO_USERNAME: ${MONGO_USERNAME:-laravel}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-secret}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: taller-laravel-api/app:dev
    container_name: taller_api_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - taller_net
    command: sh -c "composer install && php-fpm"

  webserver:
    image: nginx:1.27-alpine
    container_name: taller_api_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - taller_net

  db:
    image: postgres:16-alpine
    container_name: taller_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - api-db-data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taller_net

  redis:
    image: redis:7-alpine
    container_name: taller_api_redis
    restart: unless-stopped
    volumes:
      - api-redis-data:/data
    networks:
      - taller_net

  mongodb:
    image: mongo:7
    container_name: taller_api_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootsecret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-laravel}
      MONGO_APP_USERNAME: ${MONGO_USERNAME:-laravel}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:-secret}
    ports:
      - "${MONGO_FORWARD_PORT:-27017}:27017"
    volumes:
      - api-mongo-data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taller_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: taller_api_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - taller_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: taller-laravel-api/app:dev
    container_name: taller_api_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=5
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
    environment:
      <<: *app-env
    depends_on:
      - app
      - redis
    networks:
      - taller_net

networks:
  taller_net:
    name: taller_shared_network
    driver: bridge

volumes:
  api-db-data:
  api-redis-data:
  api-mongo-data: